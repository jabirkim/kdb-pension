<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>더행복드림 최저보증 연금 계산기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #f4f5f7; color: #1f2933; line-height: 1.6;
    padding: 18px 12px 40px; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 21px; color: #0b6b5f; margin-bottom: 4px; word-break: keep-all; line-height: 1.3; }
  .sub { color: #5a6b7b; font-size: 13px; margin-bottom: 16px; }
  .box { background:#fff; border-radius:16px; padding:16px 14px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .box h2 { font-size:15px; color:#0b6b5f; margin-bottom:12px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; color:#455; margin-bottom:5px; font-weight:600; }
  .field input, .field select {
    width:100%; padding:10px 12px; font-size:15px; border:1px solid #cdd5dd;
    border-radius:10px; background:#fff; color:#1f2933; -webkit-appearance:none;
  }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button {
    width:100%; padding:13px; font-size:16px; font-weight:800; color:#fff;
    background:linear-gradient(135deg,#0b6b5f,#14947d); border:none; border-radius:12px;
    cursor:pointer; margin-top:4px;
  }
  .hero { background:linear-gradient(135deg,#0b6b5f,#14947d); color:#fff; border-radius:16px; padding:16px 14px; margin-bottom:12px; }
  .hero-top { font-size:12px; opacity:.9; margin-bottom:6px; }
  .hero-main { font-size:28px; font-weight:900; line-height:1.15; }
  .hero-desc { font-size:13.5px; opacity:.95; margin-top:6px; }
  table.out { width:100%; border-collapse:collapse; font-size:14px; }
  table.out td { padding:9px 6px; border-bottom:1px solid #eef1f4; vertical-align:top; }
  table.out td.k { color:#637282; width:48%; }
  table.out td.v { font-weight:700; text-align:right; }
  .err { background:#fff2f0; border:1px solid #f3c2ba; color:#a33; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600; }
  .foot { font-size:11.5px; color:#8a97a3; margin-top:8px; line-height:1.5; word-break:keep-all; }
  .notice { background:#fff8e6; border:1px solid #f0e0a8; color:#7a5b00; border-radius:12px; padding:10px 12px; font-size:12.5px; font-weight:700; margin-bottom:12px; word-break:keep-all; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>더행복드림 변액연금<br>최저보증 연금 계산기</h1>
  <p class="notice">가입제안서, 공식팜플렛을 통한 내부참조용 추정값이며, 정확한 내용은 kdb생명에 문의해 주세요.</p>
  <p class="sub">출생년월일과 납입 조건을 입력해 최저보증 연금액을 계산합니다.</p>

  <div class="box">
    <h2>입력</h2>
    <div class="field">
      <label>출생년월일</label>
      <input type="date" id="dob" value="1983-01-01">
    </div>
    <div class="row">
      <div class="field">
        <label>성별</label>
        <select id="sex"><option value="F">여</option><option value="M">남</option></select>
      </div>
      <div class="field">
        <label>월납액 (만원)</label>
        <input type="number" id="monthly" value="100" min="1" step="1">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>납입년수</label>
        <input type="number" id="payYears" value="10" min="1" step="1">
      </div>
      <div class="field">
        <label>거치년수</label>
        <input type="number" id="deferYears" value="10" min="0" step="1">
      </div>
    </div>
    <button onclick="run()">계산</button>
  </div>

  <div id="result"></div>

  <div class="box">
    <h2>예시 사례 (자동 계산)</h2>
    <div id="examples" style="font-size:14px; line-height:1.7; color:#334;"></div>
    <p class="foot" style="margin-top:10px;">※ 같은 입력을 폼에 넣으면 동일하게 계산됩니다.</p>
  </div>

  <p class="foot">
    ※ 최저보증은 펀드수익 0을 가정한 금액입니다. 실제 연금액은 실적배당 결과에 따라 달라질 수 있습니다.
  </p>
  <p class="notice">가입제안서, 공식팜플렛을 통한 내부참조용 추정값이며, 정확한 내용은 kdb생명에 문의해 주세요.</p>
</div>

<script>
var BASE_RATE = [
  { lo:55, hi:59, M:0.0428, F:0.0406 },
  { lo:60, hi:64, M:0.0497, F:0.0476 },
  { lo:65, hi:69, M:0.0545, F:0.0518 },
  { lo:70, hi:74, M:0.0588, F:0.0567 },
  { lo:75, hi:80, M:0.0588, F:0.0567 }
];
var LONGTERM = [
  { lo:20, hi:24, add:0.00 },
  { lo:25, hi:29, add:0.10 },
  { lo:30, hi:39, add:0.15 },
  { lo:40, hi:200, add:0.25 }
];

function baseRate(sex, startAge){
  for (var i=0;i<BASE_RATE.length;i++){
    var r=BASE_RATE[i];
    if (startAge>=r.lo && startAge<=r.hi) return sex==='M'?r.M:r.F;
  }
  return null; // 표 범위 밖
}
function longTermAdd(insuredYears){
  for (var i=0;i<LONGTERM.length;i++){
    var r=LONGTERM[i];
    if (insuredYears>=r.lo && insuredYears<=r.hi) return r.add;
  }
  return null;
}

// entryAge: 가입(보험)나이, sex, monthly(만원), payYears, deferYears
function computePension(entryAge, sex, monthly, payYears, deferYears){
  var minDefer = (payYears===20) ? 5 : (20 - payYears);      // 최소거치 = [20-납입]년, 20년납 특례 5년
  if (deferYears < minDefer){
    var minStart = entryAge + payYears + minDefer;
    return { ok:false, reason:'최소거치 미달 (납입'+payYears+'년 → 최소거치 '+minDefer+'년)', minStartAge:minStart };
  }
  var startAge = entryAge + payYears + deferYears;           // 연금개시나이
  var insuredYears = startAge - entryAge;                    // 연금개시 전 보험기간 = 납입+거치
  var N = payYears * 12;                                     // 총 납입 횟수
  var P = monthly;                                           // 월납(만원)
  // 최저연금기준금액 (연단리): 각 보험료가 20년(240개월)까지 7%, 이후 개시까지 6%
  // 7% part = P × [ N + 0.07/12 × Σ_{m=1}^{N}(240−m) ],  Σ = N×240 − N(N+1)/2
  var sum7 = N*240 - N*(N+1)/2;
  var part7 = P * ( N + (0.07/12) * sum7 );
  var y6 = Math.max(0, (payYears + deferYears) - 20);        // 20년 경과 후 6% 적용 연수
  var part6 = N * P * 0.06 * y6;
  var baseAmount = part7 + part6;                            // 최저연금기준금액 (만원)

  var base = baseRate(sex, startAge);
  var add = longTermAdd(insuredYears);
  if (base===null) return { ok:false, reason:'개시나이 '+startAge+'세가 지급률 표(55~80세) 범위를 벗어남' };
  if (add===null)  return { ok:false, reason:'보험기간 '+insuredYears+'년이 장기유지 표 범위를 벗어남' };

  var payRate = base * (1 + add);                            // 실적배당 종신연금 지급률
  var annual = baseAmount * payRate;                         // 연 최저보증 (만원)
  var monthlyPay = annual / 12;

  return {
    ok:true, entryAge:entryAge, startAge:startAge, insuredYears:insuredYears,
    minDefer:minDefer, baseAmount:baseAmount, baseRate:base, longTermAdd:add,
    payRate:payRate, annual:annual, monthly:monthlyPay,
    principal: N * P
  };
}

function insuranceAge(dobStr, today){
  var dob = new Date(dobStr);
  var t = today || new Date();
  var months = (t.getFullYear()-dob.getFullYear())*12 + (t.getMonth()-dob.getMonth());
  if (t.getDate() < dob.getDate()) months -= 1;
  var years = Math.floor(months/12);
  var rem = months - years*12;
  if (rem >= 6) years += 1;
  return years;
}

function won(man){ // 만원 → 보기 좋은 문자열
  return Math.round(man).toLocaleString('ko-KR') + '만원';
}
function pct(x){ return (x*100).toFixed(2) + '%'; }

function run(){
  var dob = document.getElementById('dob').value;
  var sex = document.getElementById('sex').value;
  var monthly = parseFloat(document.getElementById('monthly').value);
  var payYears = parseInt(document.getElementById('payYears').value,10);
  var deferYears = parseInt(document.getElementById('deferYears').value,10);
  var entryAge = insuranceAge(dob);

  var r = computePension(entryAge, sex, monthly, payYears, deferYears);
  var el = document.getElementById('result');

  if (!r.ok){
    var msg = r.reason;
    if (r.minStartAge) msg = '입력 불가 — ' + r.reason + '. 최소 개시나이 ' + r.minStartAge + '세부터 선택 가능.';
    el.innerHTML = '<div class="box"><div class="err">'+msg+'</div>' +
      '<p class="foot">가입(보험)나이 '+entryAge+'세 기준 · 보험나이 = 계산일 기준 만나이(6개월 이상 올림)</p></div>';
    return;
  }

  el.innerHTML =
    '<div class="hero">' +
      '<div class="hero-top">최저보증 (펀드수익 0 가정) 종신 연금</div>' +
      '<div class="hero-main">월 '+won(r.monthly)+'</div>' +
      '<div class="hero-desc">연 '+won(r.annual)+' · 원금 '+won(r.principal)+' · 납입 1억당 월 '+won(r.monthly/(r.principal/10000))+'</div>' +
    '</div>' +
    '<div class="box"><h2>산출 상세</h2><table class="out">' +
      row('가입(보험)나이', entryAge+'세 <span style="font-weight:400;color:#8a97a3">(계산일 만나이, 6개월↑ 올림)</span>') +
      row('연금개시나이', r.startAge+'세') +
      row('연금개시 전 보험기간', r.insuredYears+'년') +
      row('장기유지 가산율', pct(r.longTermAdd)) +
      row('기본 지급률('+(sex==='M'?'남':'여')+')', pct(r.baseRate)) +
      row('적용 지급률', pct(r.payRate)+' <span style="font-weight:400;color:#8a97a3">= 기본×(1+장기유지)</span>') +
      row('최저연금기준금액', won(r.baseAmount)) +
      row('최저보증 연 수령액', won(r.annual)) +
      row('최저보증 월 수령액', won(r.monthly)) +
    '</table></div>';
}
function row(k,v){ return '<tr><td class="k">'+k+'</td><td class="v">'+v+'</td></tr>'; }

var EXAMPLES = [
  { entryAge:20, sex:'F', monthly:30, payYears:20, deferYears:20,
    lead:'20세에 월 30만원씩 20년 넣고 20년 더 묵혔다가' },
  { entryAge:40, sex:'F', monthly:100, payYears:15, deferYears:5,
    lead:'40세에 월 100만원씩 15년 넣고 5년 묵혔다가' }
];
function renderExamples(){
  var box = document.getElementById('examples');
  if (!box) return;
  var out = '';
  for (var i=0;i<EXAMPLES.length;i++){
    var e = EXAMPLES[i];
    var r = computePension(e.entryAge, e.sex, e.monthly, e.payYears, e.deferYears);
    if (!r.ok) continue;
    var sexK = e.sex==='M'?'남':'여';
    out += '<p style="margin-bottom:12px;">' +
      '<b>· '+e.entryAge+'세 '+sexK+' · 월 '+e.monthly+'만 · '+e.payYears+'년납+'+e.deferYears+'년거치</b><br>' +
      e.lead + ' → <b>'+r.startAge+'세부터</b> 평생 <b style="color:#0b6b5f;">월 약 '+Math.round(r.monthly)+'만원</b>' +
      ' (연 '+Math.round(r.annual).toLocaleString('ko-KR')+'만 · 장기유지 '+(r.longTermAdd*100)+'% · 원금 '+Math.round(r.principal).toLocaleString('ko-KR')+'만)' +
      '</p>';
  }
  box.innerHTML = out;
}
renderExamples();

var dobInput = document.getElementById('dob');
dobInput.addEventListener('input', run);
dobInput.addEventListener('change', run);

if (typeof module !== 'undefined' && module.exports){
  module.exports = { computePension: computePension, insuranceAge: insuranceAge };
}
</script>
</body>
</html>
